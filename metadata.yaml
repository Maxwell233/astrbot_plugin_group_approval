name: astrbot_plugin_group_approval
display_name: 群等级准入与管理员审批
author: Maxwell233
version: 0.1.1
desc: 开发调试版，提供 QQ 群等级准入、人工审批及使用权限控制；尚未完成全部真实环境验收
help: |
  用户指令：
  /申请使用 [理由] - 提交入群使用申请
  /我的权限 - 查询当前群授权状态
  /申请状态 - 查询待审申请进度
  /取消申请 - 取消待审申请
  /使用规则 - 查看当前群准入门槛
  管理员指令：
  /ga - 打开管理控制台帮助
repo: https://github.com/Maxwell233/astrbot_plugin_group_approval
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.26.0"
