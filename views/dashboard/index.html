<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstrBot AI 聊天准入</title>
  <link rel="stylesheet" href="./style.css">
  <script src="/api/plugin/page/bridge-sdk.js"></script>
</head>
<body>
<main class="app-container">
  <header class="app-header">
    <div><h1>AstrBot AI 聊天准入</h1><p class="subtitle">0.1.3 开发调试版</p></div>
    <div class="header-status">
      <label>QQ Bot <select id="global-bot-select" class="input-select"></select></label>
      <button id="refresh" class="btn btn-secondary" type="button">刷新</button>
      <span id="guard-status" role="status"></span>
    </div>
  </header>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="bot-panel" hidden>
    <section class="card">
      <h2>主群与准入设置</h2>
      <form id="settings" class="scope-form">
        <label>主群号 <input id="primary-group" inputmode="numeric" pattern="[0-9]{1,20}"></label>
        <label>等级缓存秒数 <input id="cache-ttl" type="number" min="0" max="3600" required></label>
        <label>群聊最低等级 <input id="level-GROUP" type="number" min="0" max="1000" required></label>
        <label><input id="approval-GROUP" type="checkbox"> 群聊需要人工审批</label>
        <label>私聊最低等级 <input id="level-PRIVATE" type="number" min="0" max="1000" required></label>
        <label><input id="approval-PRIVATE" type="checkbox"> 私聊需要人工审批</label>
        <label><input id="group_to_private" type="checkbox"> 群聊授权可申请免审私聊</label>
        <label><input id="private_to_group" type="checkbox"> 私聊授权可申请免审群聊</label>
        <label><input id="owner_bypass" type="checkbox"> Owner 原生聊天豁免</label>
        <button id="save-settings" type="submit" class="btn btn-primary">保存设置</button>
      </form>
    </section>
    <section class="card">
      <h2>手动授权</h2>
      <form id="manual-grant" class="scope-form">
        <label>成员 QQ <input id="grant-user" inputmode="numeric" pattern="[0-9]{1,20}" required></label>
        <label>域 <select id="grant-scope"><option>GROUP</option><option>PRIVATE</option></select></label>
        <label><input id="level-exempt" type="checkbox"> 豁免等级</label>
        <label><input id="membership-exempt" type="checkbox"> 豁免成员身份</label>
        <button id="save-grant" type="submit" class="btn btn-primary">授予</button>
        <button id="save-exemptions" type="submit" class="btn btn-secondary">仅更新现有授权豁免</button>
      </form>
    </section>
    <section class="card">
      <h2>申请与授权</h2>
      <div class="scope-form">
        <label>按 QQ 查询 <input id="user-filter" inputmode="numeric"></label>
        <button id="search" class="btn btn-secondary" type="button">查询</button>
        <label>申请域 <select id="pending-scope"><option value="">全部</option><option>GROUP</option><option>PRIVATE</option></select></label>
        <label><input id="pending-only" type="checkbox" checked> 仅待审批</label>
      </div>
      <div class="table-container"><table>
        <thead><tr><th>编号</th><th>QQ</th><th>域</th><th>状态</th><th>申请理由</th><th>审核员</th><th>审核备注</th><th>操作</th></tr></thead>
        <tbody id="applications"></tbody>
      </table></div>
      <div class="table-container"><table>
        <thead><tr><th>QQ</th><th>域</th><th>状态</th><th>来源</th><th>豁免</th><th>操作者</th><th>操作</th></tr></thead>
        <tbody id="grants"></tbody>
      </table></div>
    </section>
    <section class="card">
      <h2>主群等级快照</h2>
      <div class="table-container"><table>
        <thead><tr><th>QQ</th><th>等级</th><th>核验时间</th></tr></thead><tbody id="levels"></tbody>
      </table></div>
    </section>
    <section class="card">
      <h2>审计记录</h2>
      <div class="table-container"><table>
        <thead><tr><th>时间</th><th>操作者</th><th>目标</th><th>动作</th><th>申请</th><th>详情</th></tr></thead>
        <tbody id="audit"></tbody>
      </table></div>
    </section>
  </div>
  <dialog id="reject-dialog" aria-labelledby="reject-title">
    <form method="dialog">
      <h2 id="reject-title">拒绝申请</h2>
      <label>原因（可选） <textarea id="reject-note" maxlength="500" rows="3"></textarea></label>
      <button class="btn btn-secondary" type="submit" value="cancel">取消</button>
      <button class="btn btn-primary" type="submit" value="reject">确认拒绝</button>
    </form>
  </dialog>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
